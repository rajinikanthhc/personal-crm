    <button

      Companies
    </button>

    <button
      class="nav-btn"
      data-page="Company Type"
      onclick="showPage('Company Type')"
    >
      Company Type
    </button>

    <button
      class="nav-btn"
      data-page="Industry"
      onclick="showPage('Industry')"
    >
      Industry
    </button>

    <button
      class="nav-btn"
      data-page="Area"
      onclick="showPage('Area')"
    >
      Area
    </button>

    <button
      class="nav-btn"
      data-page="City"
      onclick="showPage('City')"
    >
      City
    </button>

    <button
      class="nav-btn"
      data-page="State"
      onclick="showPage('State')"
    >
      State
    </button>

    <button
      class="nav-btn"
      data-page="Designation"
      onclick="showPage('Designation')"
    >
      Designation
    </button>

  </nav>


  <div
    id="companyHeaderActions"
    class="header-actions"
  >

    <div class="search-wrap">

      <span class="search-icon">
        🔍
      </span>

      <input
        id="searchInput"
        class="search-box"
        type="text"
        placeholder="Search companies or people..."
      >

      <button
        id="clearSearch"
        class="clear-search"
        type="button"
      >
        ×
      </button>

    </div>


    <button
      id="addCompanyButton"

      type="button"
    >

    </button>

  </div>

</header>


<!-- =====================================================
     COMPANIES PAGE
===================================================== -->

<main
  id="companiesPage"
  class="container page"
>


  <div class="page-header">

    <div>

      <h1>
        Companies
      </h1>

      <div
        id="companyCount"
        class="count"
      >
        Loading...
      </div>

    </div>

  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th class="star-column">
            ★
          </th>

          <th
            class="sortable"
            data-sort="Company Name"
          >
            Company Name
            <span id="sort-CompanyName"></span>
          </th>

          <th
            class="sortable"
            data-sort="Company Type"
          >
            Type
            <span id="sort-CompanyType"></span>
          </th>

          <th
            class="sortable"
            data-sort="Industry"
          >
            Industry
            <span id="sort-Industry"></span>
          </th>

          <th
            class="sortable"
            data-sort="Area"
          >
            Area
            <span id="sort-Area"></span>
          </th>

          <th
            class="sortable"
            data-sort="City"
          >
            City
            <span id="sort-City"></span>
          </th>

          <th
            class="sortable"
            data-sort="State"
          >
            State
            <span id="sort-State"></span>
          </th>

          <th>
            Website
          </th>

          <th class="action-column">
            Actions
          </th>

        </tr>

      </thead>


      <tbody id="companyTable">

        <tr>

          <td
            colspan="10"
            class="loading"
          >
            Loading companies...
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</main>


<!-- =====================================================
     MASTER PAGE
===================================================== -->

<main
  id="masterPage"
  class="master-page page"
>


  <div class="master-page-header">

    <div>

      <h1 id="masterTitle">
        Company Type
      </h1>

      <div
        id="masterCount"
        class="count"
      >
        0 values
      </div>

    </div>


    <button
      id="masterAddButton"
      class="add-btn"
      type="button"
      onclick="openMasterAdd()"
    >
      + Add
    </button>

  </div>


  <div class="master-table-wrap">

    <table class="master-table">

      <thead>

        <tr>

          <th>
            #
          </th>

          <th>
            Value
          </th>

          <th class="master-action-column">
            Actions
          </th>

        </tr>

      </thead>


      <tbody id="masterTable">

      </tbody>

    </table>

  </div>

</main>


<!-- =====================================================
     MASTER FORM MODAL
===================================================== -->

>

      <button
