<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Personal CRM</title>

  <?!= include('CSS'); ?>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

  <div class="logo">
    👥 Personal CRM
  </div>


  <div class="header-actions">

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔍 Search companies or people..."
      oninput="renderCompanies()"
    >


    <button
      class="add-btn"
      onclick="openAddModal()"
    >
      + Add Company
    </button>

  </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">

  <div class="toolbar">

    <div>

      <div class="title">
        Companies
      </div>

      <div
        class="count"
        id="companyCount"
      >
        Loading...
      </div>

    </div>

  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th
            class="sortable favorite-heading"
            onclick="sortCompanies('Favorite')"
            title="Sort by Favorite"
          >
            ★
            <span
              id="sort-Favorite"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('Company Name')"
          >
            Company Name
            <span
              id="sort-CompanyName"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('Company Type')"
          >
            Type
            <span
              id="sort-CompanyType"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('Industry')"
          >
            Industry
            <span
              id="sort-Industry"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('Area')"
          >
            Area
            <span
              id="sort-Area"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('City')"
          >
            City
            <span
              id="sort-City"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('State')"
          >
            State
            <span
              id="sort-State"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('Name')"
          >
            Contact
            <span
              id="sort-Name"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('Designation')"
          >
            Designation
            <span
              id="sort-Designation"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('Phone')"
          >
            Phone
            <span
              id="sort-Phone"
              class="sort-arrow"
            ></span>
          </th>


          <th
            class="sortable"
            onclick="sortCompanies('Email')"
          >
            Email
            <span
              id="sort-Email"
              class="sort-arrow"
            ></span>
          </th>


          <th class="action-heading"></th>

        </tr>

      </thead>


      <tbody id="companyTable">

        <tr>

          <td
            colspan="12"
            class="loading"
          >
            Loading companies...
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<!-- =====================================================
     ADD / EDIT MODAL
===================================================== -->

<div
  id="formModal"
  class="modal-bg"
>

  <div class="modal">

    <div class="modal-header">

      <div
        id="formTitle"
        class="modal-title"
      >
        Add Company
      </div>


      <button
        class="close"
        onclick="closeFormModal()"
      >
        ✕
      </button>

    </div>


    <div class="form-grid">


      <div class="field full">

        <label>Company Name *</label>

        <input
          id="fCompanyName"
          type="text"
        >

      </div>


      <div class="field">

        <label>Company Type</label>

        <select
          id="fCompanyType"
        ></select>

      </div>


      <div class="field">

        <label>Industry</label>

        <select
          id="fIndustry"
        ></select>

      </div>


      <div class="field">

        <label>Area</label>

        <select
          id="fArea"
        ></select>

      </div>


      <div class="field">

        <label>City</label>

        <select
          id="fCity"
        ></select>

      </div>


      <div class="field">

        <label>State</label>

        <select
          id="fState"
        ></select>

      </div>


      <div class="field">

        <label>Website</label>

        <input
          id="fWebsite"
          type="text"
        >

      </div>


      <div class="field">

        <label>Contact Name</label>

        <input
          id="fName"
          type="text"
        >

      </div>


      <div class="field">

        <label>Designation</label>

        <select
          id="fDesignation"
        ></select>

      </div>


      <div class="field">

        <label>Phone</label>

        <input
          id="fPhone"
          type="text"
        >

      </div>


      <div class="field">

        <label>Email</label>

        <input
          id="fEmail"
          type="email"
        >

      </div>

      <div class="field">

        <label>Favorite</label>

        <select id="fFavorite">

          <option value="No">
            No
          </option>

          <option value="Yes">
            Yes
          </option>

        </select>

      </div>


      <div class="field full">

        <label>
          Visiting Card
        </label>

        <input
          id="fPhoto"
          type="file"
          accept="image/*"
          onchange="previewPhoto()"
        >


        <img
          id="photoPreview"
          class="photo-preview"
          style="display:none;"
          alt="Visiting Card Preview"
        >

      </div>


    </div>


    <div class="modal-actions">

      <button
        class="cancel-btn"
        onclick="closeFormModal()"
      >
        Cancel
      </button>


      <button
        class="save-btn"
        onclick="saveCompany()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     CONTACT DETAILS MODAL
===================================================== -->

<div
  id="contactModal"
  class="modal-bg"
>

  <div class="modal contact-modal">

    <div class="modal-header">

      <div class="modal-title">
        Contact Details
      </div>


      <button
        class="close"
        onclick="closeContactModal()"
      >
        ✕
      </button>

    </div>


    <div id="contactContent"></div>

  </div>

</div>


<?!= include('JS'); ?>


</body>

</html>
