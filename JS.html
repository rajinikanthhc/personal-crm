<script>

/* =========================================================
   PERSONAL CRM
   FRONTEND - FRESH VERSION
========================================================= */


/* =========================================================
   GLOBAL STATE
========================================================= */

let crmData = {

  companies: [],

  people: [],

  settings: {}

};

let sortKey =
  'Company Name';

let sortDirection =
  'asc';

let editingCompanyId =
  null;

let editingPersonId =
  null;

let currentCompanyId =
  null;


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
  'load',
  function() {

    setupEvents();

    loadCRM();

  }
);


/* =========================================================
   EVENTS
========================================================= */

function setupEvents() {

  document
    .getElementById('searchInput')
    .addEventListener(
      'input',
      renderCompanies
    );


  document
    .getElementById('clearSearch')
    .addEventListener(
      'click',
      clearSearch
    );


  document
    .getElementById('addCompanyButton')
    .addEventListener(
      'click',
      openAddCompany
    );


  document
    .querySelectorAll('.sortable')
    .forEach(function(header) {

      header.addEventListener(
        'click',
        function() {

          sortCompanies(
            header.dataset.sort
          );

        }
      );

    });


  document
    .getElementById('companyCloseButton')
    .addEventListener(
      'click',
      closeCompanyModal
    );


  document
    .getElementById('companyEditButton')
    .addEventListener(
      'click',
      editCurrentCompany
    );


  document
    .getElementById('companyFavoriteButton')
    .addEventListener(
      'click',
      toggleCurrentFavorite
    );


  document
    .getElementById('addPersonButton')
    .addEventListener(
      'click',
      openAddPerson
    );


  document
    .getElementById('personDetailsCloseButton')
    .addEventListener(
      'click',
      closePersonDetails
    );


  document
    .getElementById('companyFormCloseButton')
    .addEventListener(
      'click',
      closeCompanyForm
    );


  document
    .getElementById('companyCancelButton')
    .addEventListener(
      'click',
      closeCompanyForm
    );


  document
    .getElementById('companySaveButton')
    .addEventListener(
      'click',
      saveCompany
    );


  document
    .getElementById('personFormCloseButton')
    .addEventListener(
      'click',
      closePersonForm
    );


  document
    .getElementById('personCancelButton')
    .addEventListener(
      'click',
      closePersonForm
    );


  document
    .getElementById('personSaveButton')
    .addEventListener(
      'click',
      savePerson
    );


  document
    .getElementById('fFirstPhoto')
    .addEventListener(
      'change',
      function() {

        previewFile(
          this,
          'firstPhotoPreview'
        );

      }
    );


  document
    .getElementById('pPhoto')
    .addEventListener(
      'change',
      function() {

        previewFile(
          this,
          'personPhotoPreview'
        );

      }
    );


  document
    .getElementById('companyTable')
    .addEventListener(
      'click',
      handleTableClick
    );


  document
    .getElementById('companyContacts')
    .addEventListener(
      'click',
      handlePeopleClick
    );


  document
    .querySelectorAll('.modal-bg')
    .forEach(function(modal) {

      modal.addEventListener(
        'click',
        function(event) {

          if (
            event.target === modal
          ) {

            modal.classList.remove(
              'show'
            );

          }

        }
      );

    });

}


/* =========================================================
   LOAD CRM
========================================================= */

function loadCRM() {

  showTableLoading();

  google.script.run

    .withSuccessHandler(
      function(data) {

        crmData =
          data || {

            companies: [],

            people: [],

            settings: {}

          };

        populateSettings();

        renderCompanies();

      }
    )

    .withFailureHandler(
      showError
    )

    .getCRMData();

}


/* =========================================================
   SETTINGS
========================================================= */

function populateSettings() {

  fillSelect(
    'fCompanyType',
    crmData.settings['Company Type'],
    ''
  );

  fillSelect(
    'fIndustry',
    crmData.settings['Industry'],
    ''
  );

  fillSelect(
    'fArea',
    crmData.settings['Area'],
    ''
  );

  fillSelect(
    'fCity',
    crmData.settings['City'],
    ''
  );

  fillSelect(
    'fState',
    crmData.settings['State'],
    ''
  );

  fillSelect(
    'fFirstDesignation',
    crmData.settings['Designation'],
    ''
  );

  fillSelect(
    'pDesignation',
    crmData.settings['Designation'],
    ''
  );

}


/* =========================================================
   FILL SELECT
========================================================= */

function fillSelect(
  id,
  values,
  currentValue
) {

  const select =
    document.getElementById(id);

  if (!select) {
    return;
  }

  const existing =
    String(
      currentValue || ''
    ).trim();

  const list = [];

  (values || [])
    .forEach(function(value) {

      const text =
        String(
          value || ''
        ).trim();

      if (
        text &&
        list.indexOf(text) === -1
      ) {

        list.push(text);

      }

    });

  if (
    existing &&
    list.indexOf(existing) === -1
  ) {

    list.push(existing);

  }

  select.innerHTML =
    '<option value="">Select</option>';

  list.forEach(function(value) {

    const option =
      document.createElement(
        'option'
      );

    option.value =
      value;

    option.textContent =
      value;

    select.appendChild(
      option
    );

  });

  select.value =
    existing;

}


/* =========================================================
   TABLE LOADING
========================================================= */

function showTableLoading() {

  document.getElementById(
    'companyTable'
  ).innerHTML =

    '<tr>' +
      '<td colspan="10" class="loading">' +
        'Loading companies...' +
      '</td>' +
    '</tr>';

}


/* =========================================================
   SEARCH
========================================================= */

function getSearchText() {

  return String(
    document.getElementById(
      'searchInput'
    ).value || ''
  )
    .trim()
    .toLowerCase();

}


function clearSearch() {

  const input =
    document.getElementById(
      'searchInput'
    );

  input.value =
    '';

  renderCompanies();

  input.focus();

}


/* =========================================================
   RENDER COMPANIES
========================================================= */

function renderCompanies() {

  const search =
    getSearchText();

  document.getElementById(
    'clearSearch'
  ).style.display =
    search
      ? 'block'
      : 'none';


  let companies =
    crmData.companies.slice();


  /*
     Search company and contacts
  */

  if (search) {

    companies =
      companies.filter(
        function(company) {

          const companyText =
            [

              company['Company Name'],

              company['Company Type'],

              company['Industry'],

              company['Area'],

              company['City'],

              company['State'],

              company['Website']

            ]
              .join(' ')
              .toLowerCase();


          const people =
            getPeopleForCompany(
              company['ID']
            );


          const peopleText =
            people
              .map(function(person) {

                return [

                  person['Name'],

                  person['Designation'],

                  person['Phone'],

                  person['Email']

                ]
                  .join(' ');

              })
              .join(' ')
              .toLowerCase();


          return (
            companyText.indexOf(search) !== -1 ||
            peopleText.indexOf(search) !== -1
          );

        }
      );

  }


  /*
     Favorites always first.
  */

  companies.sort(
    function(a, b) {

      const favoriteA =
        normalize(
          a['Favorite']
        ) === 'yes'
          ? 1
          : 0;

      const favoriteB =
        normalize(
          b['Favorite']
        ) === 'yes'
          ? 1
          : 0;

      if (
        favoriteA !==
        favoriteB
      ) {

        return favoriteB -
               favoriteA;

      }


      let valueA;
      let valueB;


      if (
        sortKey ===
        'Contacts'
      ) {

        valueA =
          getPeopleForCompany(
            a['ID']
          ).length;

        valueB =
          getPeopleForCompany(
            b['ID']
          ).length;

        return sortDirection === 'asc'
          ? valueA - valueB
          : valueB - valueA;

      }


      valueA =
        normalize(
          a[sortKey]
        );

      valueB =
        normalize(
          b[sortKey]
        );


      if (
        valueA < valueB
      ) {

        return sortDirection === 'asc'
          ? -1
          : 1;

      }

      if (
        valueA > valueB
      ) {

        return sortDirection === 'asc'
          ? 1
          : -1;

      }

      return 0;

    }
  );


  updateSortArrows();


  const tbody =
    document.getElementById(
      'companyTable'
    );


  if (!companies.length) {

    tbody.innerHTML =

      '<tr>' +
        '<td colspan="10" class="empty">' +
          'No companies found.' +
        '</td>' +
      '</tr>';

    updateCount(
      companies.length,
      search
    );

    return;

  }


  tbody.innerHTML =
    companies
      .map(
        renderCompanyRow
      )
      .join('');


  updateCount(
    companies.length,
    search
  );

}


/* =========================================================
   COMPANY ROW
========================================================= */

function renderCompanyRow(
  company
) {

  const id =
    company['ID'];

  const favorite =
    normalize(
      company['Favorite']
    ) === 'yes';

  const people =
    getPeopleForCompany(
      id
    );


  let contactsHtml =
    '<span class="more-contacts">' +
      'No contacts' +
    '</span>';


  if (people.length) {

    const visible =
      people.slice(
        0,
        2
      );

    contactsHtml =
      '<div class="contact-list-cell">' +

      visible
        .map(function(person) {

          return (

            '<button ' +
              'class="contact-name-link" ' +
              'data-person-id="' +
              escapeAttr(
                person['ID']
              ) +
              '">' +
              escapeHtml(
                person['Name']
              ) +
            '</button>'

          );

        })
        .join('');


    if (
      people.length > 2
    ) {

      contactsHtml +=

        '<span class="more-contacts">' +
          '+' +
          (people.length - 2) +
          ' more' +
        '</span>';

    }

    contactsHtml +=
      '</div>';

  }


  let websiteHtml =
    '';


  if (
    company['Website']
  ) {

    websiteHtml =

      '<a ' +
        'class="website-link" ' +
        'href="' +
          escapeAttr(
            makeWebsiteUrl(
              company['Website']
            )
          ) +
        '" ' +
        'target="_blank">' +
        '🌐 Open' +
      '</a>';

  }


  return (

    '<tr>' +

      '<td class="star-column">' +

        '<span ' +
          'class="favorite ' +
            (
              favorite
                ? 'active'
                : 'normal'
            ) +
          '" ' +
          'data-favorite-id="' +
            escapeAttr(id) +
          '">' +
          (
            favorite
              ? '★'
              : '☆'
          ) +
        '</span>' +

      '</td>' +


      '<td>' +

        '<span ' +
          'class="company-link" ' +
          'data-company-id="' +
            escapeAttr(id) +
          '">' +

          escapeHtml(
            company['Company Name']
          ) +

        '</span>' +

      '</td>' +


      '<td>' +
        escapeHtml(
          company['Company Type']
        ) +
      '</td>' +


      '<td>' +
        escapeHtml(
          company['Industry']
        ) +
      '</td>' +


      '<td>' +
        escapeHtml(
          company['Area']
        ) +
      '</td>' +


      '<td>' +
        escapeHtml(
          company['City']
        ) +
      '</td>' +


      '<td>' +
        escapeHtml(
          company['State']
        ) +
      '</td>' +


      '<td>' +
        contactsHtml +
      '</td>' +


      '<td>' +
        websiteHtml +
      '</td>' +


      '<td>' +

        '<div class="row-actions">' +

          '<button ' +
            'class="row-action edit-company" ' +
            'data-company-id="' +
              escapeAttr(id) +
            '" ' +
            'title="Edit">' +
            '✏️' +
          '</button>' +

          '<button ' +
            'class="row-action delete-company" ' +
            'data-company-id="' +
              escapeAttr(id) +
            '" ' +
            'title="Delete">' +
            '🗑️' +
          '</button>' +

        '</div>' +

      '</td>' +

    '</tr>'

  );

}


/* =========================================================
   TABLE CLICK HANDLER
========================================================= */

function handleTableClick(
  event
) {

  const favorite =
    event.target.closest(
      '[data-favorite-id]'
    );

  if (favorite) {

    toggleFavorite(
      favorite.dataset.favoriteId
    );

    return;

  }


  const company =
    event.target.closest(
      '[data-company-id]'
    );

  if (
    company &&
    !event.target.closest(
      '.edit-company'
    ) &&
    !event.target.closest(
      '.delete-company'
    )
  ) {

    openCompanyDetails(
      company.dataset.companyId
    );

    return;

  }


  const edit =
    event.target.closest(
      '.edit-company'
    );

  if (edit) {

    openEditCompany(
      edit.dataset.companyId
    );

    return;

  }


  const remove =
    event.target.closest(
      '.delete-company'
    );

  if (remove) {

    deleteCompany(
      remove.dataset.companyId
    );

    return;

  }


  const person =
    event.target.closest(
      '[data-person-id]'
    );

  if (person) {

    openPersonDetails(
      person.dataset.personId
    );

  }

}


/* =========================================================
   PEOPLE CLICK
========================================================= */

function handlePeopleClick(
  event
) {

  const person =
    event.target.closest(
      '[data-person-id]'
    );

  if (person) {

    openPersonDetails(
      person.dataset.personId
    );

    return;

  }


  const edit =
    event.target.closest(
      '.edit-person'
    );

  if (edit) {

    openEditPerson(
      edit.dataset.personId
    );

    return;

  }


  const remove =
    event.target.closest(
      '.delete-person'
    );

  if (remove) {

    deletePerson(
      remove.dataset.personId
    );

  }

}


/* =========================================================
   SORT
========================================================= */

function sortCompanies(
  key
) {

  if (
    sortKey === key
  ) {

    sortDirection =
      sortDirection === 'asc'
        ? 'desc'
        : 'asc';

  } else {

    sortKey =
      key;

    sortDirection =
      'asc';

  }

  renderCompanies();

}


/* =========================================================
   SORT ARROWS
========================================================= */

function updateSortArrows() {

  const map = {

    'Company Name':
      'sort-CompanyName',

    'Company Type':
      'sort-CompanyType',

    'Industry':
      'sort-Industry',

    'Area':
      'sort-Area',

    'City':
      'sort-City',

    'State':
      'sort-State',

    'Contacts':
      'sort-Contacts'

  };


  Object.keys(map)
    .forEach(function(key) {

      const element =
        document.getElementById(
          map[key]
        );

      if (!element) {
        return;
      }

      element.textContent =
        key === sortKey
          ? (
              sortDirection === 'asc'
                ? '▲'
                : '▼'
            )
          : '';

    });

}


/* =========================================================
   COUNT
========================================================= */

function updateCount(
  visibleCount,
  search
) {

  const total =
    crmData.companies.length;

  const people =
    crmData.people.length;

  let text =
    total +
    (
      total === 1
        ? ' company'
        : ' companies'
    ) +
    ' • ' +
    people +
    (
      people === 1
        ? ' contact'
        : ' contacts'
    );

  if (search) {

    text +=
      ' • ' +
      visibleCount +
      ' shown';

  }

  document.getElementById(
    'companyCount'
  ).textContent =
    text;

}


/* =========================================================
   PEOPLE FOR COMPANY
========================================================= */

function getPeopleForCompany(
  companyId
) {

  return crmData.people
    .filter(function(person) {

      return String(
        person['Company ID']
      ) === String(
        companyId
      );

    })
    .sort(function(a, b) {

      return String(
        a['Name'] || ''
      ).localeCompare(
        String(
          b['Name'] || ''
        )
      );

    });

}


/* =========================================================
   COMPANY DETAILS
========================================================= */

function openCompanyDetails(
  companyId
) {

  const company =
    crmData.companies
      .find(function(item) {

        return String(
          item['ID']
        ) === String(
          companyId
        );

      });

  if (!company) {
    return;
  }

  currentCompanyId =
    companyId;


  document.getElementById(
    'companyDetailsName'
  ).textContent =
    company['Company Name'];


  document.getElementById(
    'companyDetailsSubtitle'
  ).textContent =
    [
      company['Company Type'],
      company['Industry']
    ]
      .filter(Boolean)
      .join(' • ');


  document.getElementById(
    'companyFavoriteButton'
  ).textContent =
    normalize(
      company['Favorite']
    ) === 'yes'
      ? '★'
      : '☆';


  renderCompanyDetails(
    company
  );


  renderCompanyContacts(
    companyId
  );


  showModal(
    'companyModal'
  );

}


/* =========================================================
   COMPANY DETAILS CONTENT
========================================================= */

function renderCompanyDetails(
  company
) {

  const fields = [

    [
      'Area',
      company['Area']
    ],

    [
      'City',
      company['City']
    ],

    [
      'State',
      company['State']
    ],

    [
      'Website',
      company['Website']
    ]

  ];


  document.getElementById(
    'companyDetailsContent'
  ).innerHTML =

    '<div class="company-detail-grid">' +

      fields
        .map(function(field) {

          let value =
            escapeHtml(
              field[1]
            );

          if (
            field[0] === 'Website' &&
            field[1]
          ) {

            value =

              '<a ' +
                'class="website-link" ' +
                'href="' +
                  escapeAttr(
                    makeWebsiteUrl(
                      field[1]
                    )
                  ) +
                '" ' +
                'target="_blank">' +
                escapeHtml(
                  field[1]
                ) +
              '</a>';

          }

          return (

            '<div class="company-detail-box">' +

              '<div class="detail-label">' +
                field[0] +
              '</div>' +

              '<div class="detail-value">' +
                (
                  value ||
                  '—'
                ) +
              '</div>' +

            '</div>'

          );

        })
        .join('') +

    '</div>';

}


/* =========================================================
   COMPANY CONTACTS
========================================================= */

function renderCompanyContacts(
  companyId
) {

  const people =
    getPeopleForCompany(
      companyId
    );


  document.getElementById(
    'contactCount'
  ).textContent =
    '(' +
    people.length +
    ')';


  const container =
    document.getElementById(
      'companyContacts'
    );


  if (!people.length) {

    container.innerHTML =

      '<div class="empty">' +
        'No contacts yet.' +
      '</div>';

    return;

  }


  container.innerHTML =
    people
      .map(
        renderPersonCard
      )
      .join('');

}


/* =========================================================
   PERSON CARD
========================================================= */

function renderPersonCard(
  person
) {

  const photo =
    person.photoUrl || '';

  const phone =
    String(
      person['Phone'] || ''
    ).trim();

  const email =
    String(
      person['Email'] || ''
    ).trim();


  let avatarHtml =

    '<span class="person-avatar-text">' +
      '👤' +
    '</span>';


  if (photo) {

    avatarHtml =

      '<img ' +
        'src="' +
          escapeAttr(photo) +
        '" ' +
        'alt="" ' +
      '>';

  }


  return (

    '<div class="person-card">' +

      '<div class="person-top">' +

        '<div ' +
          'class="person-avatar" ' +
          'data-person-id="' +
            escapeAttr(
              person['ID']
            ) +
          '">' +

          avatarHtml +

        '</div>' +


        '<div class="person-main">' +

          '<button ' +
            'class="person-name" ' +
            'data-person-id="' +
              escapeAttr(
                person['ID']
              ) +
            '">' +

            escapeHtml(
              person['Name']
            ) +

          '</button>' +

          '<div class="person-designation">' +

            (
              escapeHtml(
                person['Designation']
              ) ||
              '—'
            ) +

          '</div>' +

        '</div>' +


        '<div class="person-actions">' +

          '<button ' +
            'class="person-action edit-person" ' +
            'data-person-id="' +
              escapeAttr(
                person['ID']
              ) +
            '">' +
            '✏️' +
          '</button>' +

          '<button ' +
            'class="person-action delete-person" ' +
            'data-person-id="' +
              escapeAttr(
                person['ID']
              ) +
            '">' +
            '🗑️' +
          '</button>' +

        '</div>' +

      '</div>' +


      '<div class="person-info">' +

        (
          phone
            ? (
                '<a href="tel:' +
                  escapeAttr(phone) +
                '">' +
                  '📞 ' +
                  escapeHtml(phone) +
                '</a>'
              )
            : ''
        ) +

        (
          email
            ? (
                '<a href="mailto:' +
                  escapeAttr(email) +
                '">' +
                  '✉️ ' +
                  escapeHtml(email) +
                '</a>'
              )
            : ''
        ) +

      '</div>' +


      '<div class="person-buttons">' +

        (
          phone
            ? (
                '<a href="tel:' +
                  escapeAttr(phone) +
                '">' +
                  '📞 Call' +
                '</a>' +

                '<a href="' +
                  escapeAttr(
                    makeWhatsAppUrl(
                      phone
                    )
                  ) +
                  '" target="_blank">' +
                  '💬 WhatsApp' +
                '</a>'
              )
            : ''
        ) +

        (
          email
            ? (
                '<a href="mailto:' +
                  escapeAttr(email) +
                '">' +
                  '✉️ Email' +
                '</a>'
              )
            : ''
        ) +

      '</div>' +

    '</div>'

  );

}


/* =========================================================
   ADD COMPANY
========================================================= */

function openAddCompany() {

  editingCompanyId =
    null;

  document.getElementById(
    'companyFormTitle'
  ).textContent =
    'Add Company';


  clearCompanyForm();


  document.getElementById(
    'firstContactSection'
  ).style.display =
    'block';


  document.getElementById(
    'companySaveButton'
  ).textContent =
    'Save';


  showModal(
    'companyFormModal'
  );

}


/* =========================================================
   EDIT COMPANY
========================================================= */

function openEditCompany(
  companyId
) {

  const company =
    crmData.companies
      .find(function(item) {

        return String(
          item['ID']
        ) === String(
          companyId
        );

      });

  if (!company) {
    return;
  }

  editingCompanyId =
    companyId;


  document.getElementById(
    'companyFormTitle'
  ).textContent =
    'Edit Company';


  document.getElementById(
    'firstContactSection'
  ).style.display =
    'none';


  document.getElementById(
    'companySaveButton'
  ).textContent =
    'Save Changes';


  document.getElementById(
    'fCompanyName'
  ).value =
    company['Company Name'] || '';


  fillSelect(
    'fCompanyType',

      null;

        function(result) {

              firstPhone,

                loadCRM();

            )

            .withFailureHandler(
              function(error) {

                button.disabled =
                  false;

                showError(error);

            )

            .addPerson(
              companyId,
              person,
              imageData
            );

      )

      .withFailureHandler(
        function(error) {

          button.disabled =
            false;

          showError(error);

        }

      .addCompany(
        company

  catch (error) {

/* =========================================================

function openPersonDetails(
  personId

  const person =
    crmData.people
      .find(function(item) {

        return String(
          item['ID']
        ) === String(
          personId
        );

      });

  if (!person) {
    return;
  }


  const company =
    crmData.companies
      .find(function(item) {

        return String(
          item['ID']
        ) === String(
          person['Company ID']
        );

      });


  const photo =
    person.photoUrl || '';

  const phone =
    String(
      person['Phone'] || ''
    ).trim();

  const email =
    String(
      person['Email'] || ''
    ).trim();


  let html =
    '';


  if (photo) {

    html +=

      '<img ' +
        'class="person-card-image-large" ' +
        'src="' +
          escapeAttr(photo) +
        '" ' +
        'alt=""' +
      '>';

  }


  html +=

    '<div class="person-detail-name">' +
      escapeHtml(
        person['Name']
      ) +
    '</div>';


  html +=

    '<div class="person-detail-company">' +

      (
        escapeHtml(
          person['Designation']
        ) ||
        ''
      ) +

      (
        company
          ? (
              ' • ' +
              escapeHtml(
                company['Company Name']
              )
            )
          : ''
      ) +

    '</div>';


  if (phone) {

    html +=

      '<div class="detail-row">' +

        '<div class="detail-label">' +
          'Phone' +
        '</div>' +

        '<div class="detail-value">' +
          escapeHtml(phone) +
        '</div>' +

      '</div>';

  }


  if (email) {

    html +=

      '<div class="detail-row">' +

        '<div class="detail-label">' +
          'Email' +
        '</div>' +

        '<div class="detail-value">' +
          escapeHtml(email) +
        '</div>' +

      '</div>';

  }


  html +=

    '<div class="contact-actions">';


  if (phone) {

    html +=

      '<a href="tel:' +
        escapeAttr(phone) +
      '">' +
        '📞 Call' +
      '</a>' +

      '<a href="' +
        escapeAttr(
          makeWhatsAppUrl(
            phone
          )
        ) +
        '" target="_blank">' +
        '💬 WhatsApp' +
      '</a>';

  }


  if (email) {

    html +=

      '<a href="mailto:' +
        escapeAttr(email) +
      '">' +
        '✉️ Email' +
      '</a>';

  }


  if (
    company &&
    company['Website']

    html +=

      '<a href="' +
        escapeAttr(
          makeWebsiteUrl(
            company['Website']
          )
        ) +
        '" target="_blank">' +
        '🌐 Website' +
      '</a>';

  }


  html +=
    '</div>';


  document.getElementById(
    'personDetailsContent'
  ).innerHTML =
    html;


  showModal(
    'personDetailsModal'
  );

/* =========================================================
   FILE PREVIEW
========================================================= */

function previewFile(
  input,
  previewId
) {

  const file =
    input.files[0];

  const preview =
    document.getElementById(
      previewId
    );


  if (!file) {

    preview.src =
      '';

    preview.style.display =
      'none';

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      preview.src =
        event.target.result;

      preview.style.display =
        'block';

    };


  reader.readAsDataURL(
    file
  );

}


/* =========================================================
   READ / RESIZE IMAGE
========================================================= */

function readImageFile(
  file
) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const image =
            new Image();


          image.onload =
            function() {

              const maxSize =
                1600;

              let width =
                image.width;

              let height =
                image.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                if (
                  width > height
                ) {

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                } else {

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  'canvas'
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  '2d'
                );


              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              const dataUrl =
                canvas.toDataURL(
                  'image/jpeg',
                  0.88
                );


              resolve({

                base64:
                  dataUrl.split(',')[1],

                mimeType:
                  'image/jpeg'

              });

            };


          image.onerror =
            function() {

              reject(
                new Error(
                  'Could not process image.'
                )
              );

            };


          image.src =
            event.target.result;

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              'Could not read image.'
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   CLEAR FILE
========================================================= */

function clearFile(
  inputId,
  previewId
) {

  const input =
    document.getElementById(
      inputId
    );

  const preview =
    document.getElementById(
      previewId
    );


  if (input) {

  }


  if (preview) {

    preview.src =
      '';

    preview.style.display =
      'none';

  }

}


/* =========================================================
   WEBSITE URL
========================================================= */

function makeWebsiteUrl(
  website
) {

  const value =
    String(
      website || ''
    ).trim();

  if (!value) {
    return '';
  }

  if (
    /^https?:\/\//i.test(value)
  ) {

    return value;

  }

  return (
    'https://' +
    value
  );

}


/* =========================================================
   WHATSAPP URL
========================================================= */

function makeWhatsAppUrl(
  phone
) {

  let digits =
    String(
      phone || ''
    )
      .replace(
        /\D/g,
        ''
      );


  if (
    digits.length === 10
  ) {

    digits =
      '91' +
      digits;

  }


  return (
    'https://wa.me/' +
    digits
  );

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(
  value
) {

  return String(
    value || ''
  )
    .trim()
    .toLowerCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttr(
  value
) {

  return escapeHtml(
    value
  );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
  error
) {

  const message =
    error &&
    error.message
      ? error.message
      : String(error);


  console.error(
    error
  );


  alert(
    message
  );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
  message
) {

  const toast =
    document.getElementById(
      'toast'
    );


  toast.textContent =
    message;


  toast.classList.add(
    'show'
  );


  setTimeout(
    function() {

      toast.classList.remove(
        'show'
      );

    },
    2200
  );

}
