<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #172033;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  height: 74px;
  background: #ffffff;
  border-bottom: 1px solid #e1e5eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.logo {
  font-size: 23px;
  font-weight: 700;
  color: #172033;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-wrap {
  position: relative;
}

.search-box {
  width: 320px;
  height: 40px;
  padding: 0 38px 0 38px;
  border: 1px solid #d2d8e2;
  border-radius: 9px;
  outline: none;
  font-size: 14px;
  background: #ffffff;
}

.search-box:focus {
  border-color: #4f46e5;
}

.search-icon {
  position: absolute;
  left: 13px;
  top: 10px;
  font-size: 14px;
}

.clear-search {
  position: absolute;
  right: 7px;
  top: 6px;
  width: 28px;
  height: 28px;
  padding: 0;
  background: transparent;
  color: #7b8492;
  font-size: 20px;
  display: none;
}

.add-btn {
  height: 40px;
  padding: 0 17px;
  background: #4f46e5;
  color: white;
  font-weight: 600;
}

.add-btn:hover {
  background: #4338ca;
}


/* =====================================================
   MAIN
===================================================== */

.container {
  padding: 26px;
}

.page-header {
  margin-bottom: 18px;
}

.page-header h1 {
  margin: 0;
  font-size: 26px;
}

.count {
  margin-top: 5px;
  color: #6b7280;
  font-size: 13px;
}


/* =====================================================
   TABLE
===================================================== */

.table-wrap {
  background: white;
  border: 1px solid #dfe4eb;
  border-radius: 12px;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 1180px;
  border-collapse: collapse;
}

th {
  background: #f8fafc;
  color: #596273;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  padding: 13px 12px;
  white-space: nowrap;
  border-bottom: 1px solid #e5e9ef;
}

th.sortable {
  cursor: pointer;
  user-select: none;
}

th.sortable:hover {
  background: #eef2ff;
  color: #4338ca;
}

th span {
  color: #4f46e5;
  margin-left: 4px;
}

td {
  padding: 13px 12px;
  border-bottom: 1px solid #edf0f4;
  font-size: 13px;
  white-space: nowrap;
}

tr:last-child td {
  border-bottom: 0;
}

tr:hover td {
  background: #fafbff;
}

.star-column {
  width: 45px;
  text-align: center;
}

.action-column {
  width: 100px;
  text-align: center;
}

.favorite {
  font-size: 21px;
  cursor: pointer;
  user-select: none;
}

.favorite.normal {
  color: #aab2bf;
}

.favorite.active {
  color: #f59e0b;
}

.company-link {
  color: #172033;
  font-weight: 700;
  cursor: pointer;
}

.company-link:hover {
  color: #4f46e5;
  text-decoration: underline;
}

.contact-list-cell {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.contact-name-link {
  padding: 0;
  background: transparent;
  color: #2563eb;
  text-align: left;
  font-weight: 600;
}

.contact-name-link:hover {
  text-decoration: underline;
}

.more-contacts {
  color: #7b8492;
  font-size: 12px;
}

.website-link {
  color: #2563eb;
  text-decoration: none;
}

.website-link:hover {
  text-decoration: underline;
}

.row-actions {
  display: flex;
  justify-content: center;
  gap: 4px;
}

.row-action {
  padding: 5px 7px;
  background: transparent;
  font-size: 17px;
}

.row-action:hover {
  background: #f1f3f5;
}

.loading,
.empty {
  text-align: center;
  padding: 50px;
  color: #6b7280;
}


/* =====================================================
   MODALS
===================================================== */

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .48);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 720px;
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
}

.company-modal {
  max-width: 900px;
}

.person-details-modal {
  max-width: 700px;
}

.form-modal {
  max-width: 650px;
}

.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 22px;
}

.modal-title {
  font-size: 23px;
  font-weight: 700;
}

.modal-subtitle {
  margin-top: 5px;
  color: #6b7280;
  font-size: 14px;
}

.modal-header-actions {
  display: flex;
  gap: 5px;
  align-items: center;
}

.close,
.icon-button,
.favorite-modal {
  width: 36px;
  height: 36px;
  padding: 0;
  background: #f1f3f5;
  font-size: 17px;
}

.favorite-modal {
  background: transparent;
  color: #f59e0b;
  font-size: 25px;
}

.close:hover,
.icon-button:hover {
  background: #e9edf2;
}


/* =====================================================
   COMPANY DETAILS
===================================================== */

.company-detail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.company-detail-box {
  padding: 14px;
  border: 1px solid #e5e9ef;
  border-radius: 9px;
  background: #fafbfc;
}

.detail-label {
  font-size: 11px;
  color: #7b8492;
  margin-bottom: 5px;
}

.detail-value {
  font-size: 14px;
  font-weight: 600;
  word-break: break-word;
}


/* =====================================================
   SECTION HEADER
===================================================== */

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 18px 0 14px;
}

.section-header h2 {
  margin: 0;
  font-size: 18px;
}

.section-count {
  color: #6b7280;
  font-weight: 400;
}

.small-add-btn {
  background: #4f46e5;
  color: white;
  padding: 8px 12px;
  font-size: 13px;
}


/* =====================================================
   PEOPLE CARDS
===================================================== */

.people-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.person-card {
  border: 1px solid #e1e5eb;
  border-radius: 11px;
  padding: 15px;
  background: white;
}

.person-top {
  display: flex;
  gap: 12px;
  align-items: center;
}

.person-avatar {
  width: 52px;
  height: 52px;
  border-radius: 9px;
  background: #f1f3f5;
  overflow: hidden;
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.person-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.person-avatar-text {
  font-size: 25px;
}

.person-main {
  flex: 1;
  min-width: 0;
}

.person-name {
  padding: 0;
  background: transparent;
  color: #172033;
  font-size: 16px;
  font-weight: 700;
  text-align: left;
}

.person-name:hover {
  color: #4f46e5;
}

.person-designation {
  margin-top: 4px;
  color: #6b7280;
  font-size: 12px;
}

.person-actions {
  display: flex;
}

.person-action {
  padding: 5px;
  background: transparent;
}

.person-action:hover {
  background: #f1f3f5;
}

.person-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 13px;
}

.person-info a {
  color: #2563eb;
  text-decoration: none;
  font-size: 13px;
}

.person-buttons {
  display: flex;
  gap: 7px;
  margin-top: 13px;
  flex-wrap: wrap;
}

.person-buttons a,
.contact-actions a {
  padding: 8px 11px;
  border-radius: 7px;
  background: #f1f3f5;
  color: #172033;
  text-decoration: none;
  font-size: 12px;
}

.person-buttons a:hover,
.contact-actions a:hover {
  background: #e5e7eb;
}


/* =====================================================
   PERSON DETAILS
===================================================== */

.person-card-image-large {
  width: 100%;
  max-height: 430px;
  object-fit: contain;
  border: 1px solid #e1e5eb;
  border-radius: 10px;
  background: #f8fafc;
  margin-bottom: 20px;
}

.person-detail-name {
  font-size: 25px;
  font-weight: 700;
}

.person-detail-company {
  margin-top: 5px;
  margin-bottom: 18px;
  color: #6b7280;
}

.contact-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  flex-wrap: wrap;
}


/* =====================================================
   FORM
===================================================== */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field.full {
  grid-column: 1 / -1;
}

.field label {
  font-size: 12px;
  font-weight: 600;
  color: #596273;
}

.field input,
.field select {
  width: 100%;
  height: 40px;
  padding: 0 11px;
  border: 1px solid #d2d8e2;
  border-radius: 7px;
  outline: none;
  background: white;
  font-size: 14px;
}

.field input:focus,
.field select:focus {
  border-color: #4f46e5;
}

.first-contact-section {
  margin-top: 25px;
  padding-top: 18px;
  border-top: 1px solid #e5e9ef;
}

.photo-preview {
  display: none;
  width: 100%;
  max-height: 260px;
  object-fit: contain;
  border: 1px solid #dfe4eb;
  border-radius: 8px;
  margin-top: 8px;
  background: #f8fafc;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 25px;
}

.cancel-btn {
  background: #eef0f3;
}

.save-btn {
  background: #4f46e5;
  color: white;
}

.save-btn:disabled {
  opacity: .6;
  cursor: wait;
}


/* =====================================================
   TOAST
===================================================== */

.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translate(-50%, 20px);
  background: #172033;
  color: white;
  padding: 11px 17px;
  border-radius: 8px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
  z-index: 300;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 800px) {

  .header {
    height: auto;
    padding: 14px;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }

  .header-actions {
    width: 100%;
  }

  .search-wrap {
    flex: 1;
  }

  .search-box {
    width: 100%;
  }

  .container {
    padding: 15px;
  }

  .company-detail-grid,
  .people-grid,
  .form-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .modal {
    max-height: 95vh;
    padding: 18px;
  }

}

/* =====================================================
   MAIN NAVIGATION
===================================================== */

.header {
  height: auto;
  min-height: 74px;
  flex-wrap: wrap;
  gap: 10px;
  padding-top: 12px;
  padding-bottom: 12px;
}


.main-nav {
  display: flex;
  align-items: center;
  gap: 5px;
  flex: 1;
  justify-content: center;
  flex-wrap: wrap;
}


.nav-btn {
  background: transparent;
  color: #596273;
  border: 1px solid transparent;
  padding: 8px 11px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}


.nav-btn:hover {
  background: #f1f3f5;
  color: #4f46e5;
}


.nav-btn.active {
  background: #4f46e5;
  color: white;
}


.page {
  display: none;
}


.page.active {
  display: block;
}


/* =====================================================
   MASTER PAGE
===================================================== */

.master-page {
  padding: 26px;
}


.master-page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}


.master-page-header h1 {
  margin: 0;
  font-size: 26px;
}


.master-table-wrap {
  background: white;
  border: 1px solid #dfe4eb;
  border-radius: 12px;
  overflow: hidden;
}


.master-table {
  width: 100%;
  min-width: 500px;
  border-collapse: collapse;
}


.master-table th {
  background: #f8fafc;
  color: #596273;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  padding: 13px 15px;
  border-bottom: 1px solid #e5e9ef;
}


.master-table td {
  padding: 13px 15px;
  border-bottom: 1px solid #edf0f4;
  font-size: 14px;
}


.master-table tr:last-child td {
  border-bottom: 0;
}


.master-table tr:hover td {
  background: #fafbff;
}


.master-action-column {
  width: 120px;
  text-align: center !important;
}


.master-actions {
  display: flex;
  justify-content: center;
  gap: 5px;
}


.master-action-btn {
  border: 0;
  background: transparent;
  padding: 6px 8px;
  cursor: pointer;
  font-size: 16px;
  border-radius: 6px;
}


.master-action-btn:hover {
  background: #f1f3f5;
}


.master-form-modal {
  max-width: 480px;
}


/* =====================================================
   MOBILE NAV
===================================================== */

@media (max-width: 1100px) {

  .header {
    align-items: stretch;
  }

  .logo {
    width: 100%;
  }

  .main-nav {
    width: 100%;
    order: 3;
    justify-content: flex-start;
    overflow-x: auto;
    flex-wrap: nowrap;
  }

  .nav-btn {
    white-space: nowrap;
  }

  .header-actions {
    margin-left: auto;
  }

}


@media (max-width: 800px) {

  .header-actions {
    width: 100%;
    margin-left: 0;
  }

  .master-page {
    padding: 15px;
  }

  .master-page-header {
    gap: 12px;
    align-items: flex-start;
  }

}

</style>
