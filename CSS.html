<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f5f7fa;

  color:
    #172033;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  height: 72px;

  background:
    white;

  border-bottom:
    1px solid #e2e6ed;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    0 28px;

  position:
    sticky;

  top: 0;

  z-index: 20;

}


.logo {

  font-size:
    22px;

  font-weight:
    700;

}


.header-actions {

  display:
    flex;

  gap:
    10px;

  align-items:
    center;

}


.search-box {

  width:
    320px;

  padding:
    11px 15px;

  border:
    1px solid #d3d9e2;

  border-radius:
    9px;

  outline:
    none;

  font-size:
    14px;

}


.search-box:focus {

  border-color:
    #4f46e5;

}


button {

  border:
    0;

  cursor:
    pointer;

  border-radius:
    8px;

  padding:
    10px 15px;

  font-size:
    14px;

}


.add-btn {

  background:
    #4f46e5;

  color:
    white;

}


.add-btn:hover {

  background:
    #4338ca;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

  padding:
    25px;

}


.toolbar {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom:
    18px;

}


.title {

  font-size:
    25px;

  font-weight:
    700;

}


.count {

  color:
    #6b7280;

  font-size:
    13px;

  margin-top:
    4px;

}


/* =====================================================
   TABLE
===================================================== */

.table-wrap {

  background:
    white;

  border:
    1px solid #e1e5eb;

  border-radius:
    12px;

  overflow-x:
    auto;

}


table {

  width:
    100%;

  border-collapse:
    collapse;

  min-width:
    1100px;

}


th {

  background:
    #f8fafc;

  padding:
    13px 12px;

  text-align:
    left;

  font-size:
    12px;

  color:
    #596273;

  white-space:
    nowrap;

  user-select:
    none;

}


th.sortable {

  cursor:
    pointer;

}


th.sortable:hover {

  background:
    #eef2ff;

  color:
    #3730a3;

}


.sort-arrow {

  display:
    inline-block;

  margin-left:
    5px;

  font-size:
    10px;

  color:
    #4f46e5;

}


.favorite-heading {

  text-align:
    center;

}


.action-heading {

  width:
    55px;

}


td {

  padding:
    13px 12px;

  border-top:
    1px solid #edf0f4;

  font-size:
    13px;

  white-space:
    nowrap;

}


tr:hover td {

  background:
    #fafbff;

}


/* =====================================================
   FAVORITE
===================================================== */

.favorite {

  font-size:
    21px;

  cursor:
    pointer;

  user-select:
    none;

}


.favorite.normal {

  color:
    #a8b0bd;

}


.favorite.active {

  color:
    #f59e0b;

}


/* =====================================================
   CONTACT
===================================================== */

.contact-link {

  color:
    #2563eb;

  font-weight:
    600;

  cursor:
    pointer;

}


.contact-link:hover {

  text-decoration:
    underline;

}


.phone-link,
.email-link {

  color:
    #2563eb;

  text-decoration:
    none;

}


.phone-link:hover,
.email-link:hover {

  text-decoration:
    underline;

}


/* =====================================================
   ACTION
===================================================== */

.action {

  position:
    relative;

  text-align:
    center;

}


.edit-btn {

  background:
    transparent;

  padding:
    5px 8px;

  font-size:
    19px;

}


.edit-btn:hover {

  background:
    #f1f3f5;

}


.menu {

  display:
    none;

  position:
    absolute;

  right:
    5px;

  top:
    38px;

  background:
    white;

  border:
    1px solid #ddd;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.12);

  border-radius:
    8px;

  z-index:
    30;

  min-width:
    120px;

}


.menu.show {

  display:
    block;

}


.menu div {

  padding:
    10px 13px;

  cursor:
    pointer;

  font-size:
    13px;

}


.menu div:hover {

  background:
    #f3f4f6;

}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty {

  text-align:
    center;

  padding:
    50px;

  color:
    #6b7280;

}


.loading {

  padding:
    50px;

  text-align:
    center;

  color:
    #6b7280;

}


/* =====================================================
   MODAL
===================================================== */

.modal-bg {

  display:
    none;

  position:
    fixed;

  inset:
    0;

  background:
    rgba(0,0,0,.45);

  z-index:
    100;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

}


.modal-bg.show {

  display:
    flex;

}


.modal {

  background:
    white;

  width:
    100%;

  max-width:
    620px;

  max-height:
    92vh;

  overflow-y:
    auto;

  border-radius:
    14px;

  padding:
    24px;

}


.modal-header {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom:
    20px;

}


.modal-title {

  font-size:
    21px;

  font-weight:
    700;

}


.close {

  background:
    #f1f3f5;

  font-size:
    18px;

  padding:
    5px 10px;

}


.close:hover {

  background:
    #e5e7eb;

}


/* =====================================================
   FORM
===================================================== */

.form-grid {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    14px;

}


.field {

  display:
    flex;

  flex-direction:
    column;

  gap:
    6px;

}


.field.full {

  grid-column:
    1 / -1;

}


.field label {

  font-size:
    12px;

  color:
    #5b6472;

  font-weight:
    600;

}


.field input,
.field select {

  width:
    100%;

  padding:
    10px;

  border:
    1px solid #d3d9e2;

  border-radius:
    7px;

  outline:
    none;

}


.field input:focus,
.field select:focus {

  border-color:
    #4f46e5;

}


/* =====================================================
   MODAL ACTIONS
===================================================== */

.modal-actions {

  display:
    flex;

  justify-content:
    flex-end;

  gap:
    10px;

  margin-top:
    22px;

}


.cancel-btn {

  background:
    #eef0f3;

}


.save-btn {

  background:
    #4f46e5;

  color:
    white;

}


.save-btn:hover {

  background:
    #4338ca;

}


/* =====================================================
   PHOTO PREVIEW
===================================================== */

.photo-preview {

  max-width:
    100%;

  max-height:
    280px;

  border-radius:
    8px;

  border:
    1px solid #ddd;

  margin-top:
    8px;

  object-fit:
    contain;

}


/* =====================================================
   CONTACT MODAL
===================================================== */

.contact-modal {

  max-width:
    700px;

}


.visiting-card-area {

  margin-bottom:
    20px;

}


.visiting-card-title {

  font-size:
    12px;

  font-weight:
    600;

  color:
    #6b7280;

  margin-bottom:
    8px;

}


.photo-loading {

  padding:
    20px;

  text-align:
    center;

  color:
    #6b7280;

  background:
    #f8fafc;

  border-radius:
    8px;

}


.card-image {

  width:
    100%;

  max-height:
    420px;

  object-fit:
    contain;

  border:
    1px solid #ddd;

  border-radius:
    10px;

  background:
    #f8fafc;

  margin-bottom:
    20px;

  cursor:
    pointer;

}


.contact-name {

  font-size:
    24px;

  font-weight:
    700;

}


.contact-company {

  color:
    #6b7280;

  margin-top:
    4px;

  margin-bottom:
    18px;

}


.detail-row {

  padding:
    10px 0;

  border-bottom:
    1px solid #edf0f4;

}


.detail-label {

  font-size:
    11px;

  color:
    #7b8492;

  margin-bottom:
    3px;

}


.detail-value {

  font-size:
    14px;

  font-weight:
    600;

}


.contact-actions {

  display:
    flex;

  gap:
    10px;

  margin-top:
    20px;

  flex-wrap:
    wrap;

}


.contact-actions a {

  text-decoration:
    none;

  padding:
    10px 14px;

  border-radius:
    8px;

  background:
    #f1f3f5;

  color:
    #172033;

  font-size:
    13px;

}


.contact-actions a:hover {

  background:
    #e5e7eb;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 800px) {

  .header {

    height:
      auto;

    padding:
      15px;

    gap:
      12px;

    flex-direction:
      column;

    align-items:
      stretch;

  }


  .header-actions {

    flex-direction:
      column;

    align-items:
      stretch;

  }


  .search-box {

    width:
      100%;

  }


  .container {

    padding:
      15px;

  }


  .toolbar {

    align-items:
      flex-start;

    gap:
      12px;

    flex-direction:
      column;

  }


  .form-grid {

    grid-template-columns:
      1fr;

  }

}

</style>
